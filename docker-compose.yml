# 개발용 DB · 캐시. `docker compose up -d`로 띄우고 `docker compose down`으로 끈다 (데이터는 볼륨에 남는다)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lunchtime
      POSTGRES_PASSWORD: lunchtime
      POSTGRES_DB: lunchtime
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchtime"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 이미지 저장소 (S3 호환, RustFS). MinIO는 커뮤니티 이미지 배포를 멈춰 받을 수 없었다(2026-10).
  # 운영에서는 S3 · R2 등으로 바꾸고 .env의 S3_*만 고친다. 버킷 · 공개 읽기는 개발 서버가 켜질 때 만든다
  storage:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: lunchtime
      RUSTFS_SECRET_KEY: lunchtime-storage
    ports:
      - "9000:9000"
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
